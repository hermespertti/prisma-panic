<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%99%3C/text%3E%3C/svg%3E" />
<title>PRISMA PANIC — the store closes when the pants decide</title>
<meta property="og:title" content="PRISMA PANIC — the store closes when the pants decide"/>
<meta property="og:description" content="A third-person supermarket roguelike where your bladder is the health bar. Sprint the aisles, dodge staff, find a toilet. The lights die at closing — wherever you're standing."/>
<meta property="og:url" content="https://hermespertti.github.io/prisma-panic/"/>
<meta property="og:image" content="https://hermespertti.github.io/prisma-panic/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="theme-color" content="#0b0c11"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
<meta property="og:type" content="website"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://hermespertti.github.io/prisma-panic/og-image.png"/>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#11131a;
    font-family:"Segoe UI", system-ui, sans-serif; }
  #hud { position:fixed; inset:0; pointer-events:none; color:#e8ecf2;
    font-size:15px; text-shadow:0 1px 4px #000, 0 0 14px #000; }
  .bar { position:absolute; left:24px; bottom:52px; width:340px; height:26px;
    background:#0e0f14cc; border:1px solid #ffffff22; border-radius:5px; overflow:hidden; }
  .barfill { height:100%; width:10%; background:#57cc57; transition:width .12s linear; }
  .lbl { position:absolute; letter-spacing:.4px; }
  .state { left:24px; bottom:84px; font-size:18px; font-weight:600; }
  .clock { top:14px; left:24px; font-size:15px; }
  .quota { top:38px; left:24px; font-size:14px; color:#cfd3da; }
  .floor { top:58px; left:24px; font-size:13px; color:#8ecbff99; letter-spacing:1.5px; }
  .hint { bottom:22vh; left:50%; transform:translateX(-50%); font-size:19px;
    background:#0e0f14b3; padding:5px 16px; border-radius:7px; white-space:nowrap; }
  .wet { bottom:34vh; left:50%; transform:translateX(-50%); font-size:30px;
    font-weight:800; letter-spacing:6px; color:#8ecbffcc; }
  .toast { position:absolute; top:64px; left:50%; transform:translateX(-50%);
    font-size:19px; opacity:0; text-align:center; max-width:88vw;
    background:#0e0f14c9; padding:8px 18px; border-radius:9px; line-height:1.45; }
  .summary { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(600px, 92vw);
    max-height:92vh; overflow-y:auto;
    text-align:center; font-size:20px; line-height:1.75;
    background:#0b0c11f2; border:1px solid #ffffff14; border-radius:14px;
    padding:30px 30px 26px; box-shadow:0 0 44px #000c; }
  .report { margin:4px auto 16px; max-width:520px; text-align:left;
    background:#12141c; border-left:3px solid #e67a14; border-radius:8px; padding:14px 18px 12px; }
  .reporthead { font-size:12px; font-weight:800; letter-spacing:4px; color:#e67a14; margin-bottom:8px; }
  .reportline { font-size:14.5px; line-height:1.5; color:#dfe3ec; padding:4px 0;
    border-bottom:1px dashed #ffffff12; }
  .reportline:last-child { border-bottom:none; color:#f2c40e; }
  .rank { font-size:96px; font-weight:900; line-height:1; letter-spacing:0; margin:6px 0 2px; }
  .rS { color:#f2c40e; text-shadow:0 0 26px #f2c40e88; }
  .rA { color:#57cc57; } .rB { color:#5ab8f2; } .rC { color:#d9d94d; } .rD { color:#e64433; }
  .statrow { display:flex; justify-content:space-between; gap:30px; font-size:16px;
    color:#cfd3da; border-bottom:1px solid #ffffff10; padding:7px 4px; }
  .statrow b { color:#fff; font-weight:700; }
  .pb { margin-top:10px; font-size:15px; color:#f2c40e; letter-spacing:1px; }
  .endingline { font-size:17px; color:#e8e8f0; margin:10px 0 14px; min-height:1.4em; }
  .picker { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(640px, 92vw);
    text-align:center; background:#0b0c11f2; border:1px solid #ffffff1e; border-radius:14px;
    padding:26px 28px 30px; box-shadow:0 0 44px #000c; }
  .ptitle { font-size:20px; font-weight:800; letter-spacing:3px; color:#e67a14; margin-bottom:18px; }
  .popt { display:block; width:100%; margin:12px 0; padding:14px 18px; font:inherit; font-size:17px;
    color:#e8ecf2; background:#161a24; border:1px solid #ffffff26; border-radius:9px; cursor:pointer;
    text-align:left; line-height:1.5; pointer-events:auto; }
  .popt:hover { background:#202839; border-color:#e67a14; }
  .popt .pn { font-weight:800; color:#ff9c3d; }
  .title { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; cursor:pointer;
    background:radial-gradient(ellipse at 50% 40%, #11131acc 0%, #0b0c11f0 70%); color:#e8ecf2; }
  .tlogo { font-size:64px; font-weight:900; letter-spacing:10px; color:#fff;
    text-shadow:0 0 34px #e67a1488, 0 2px 0 #000; }
  .ttag { font-size:17px; letter-spacing:3px; color:#e67a14; }
  .tbest { font-size:15px; color:#f2c40e; letter-spacing:1px; margin-top:6px; }
  .tctrl { font-size:14px; line-height:1.7; color:#cfd3da; margin-top:18px; }
  .tgo { margin-top:22px; font-size:19px; font-weight:800; letter-spacing:4px; color:#fff;
    padding:11px 26px; border:1px solid #ffffff2e; border-radius:9px; background:#161a2488;
    animation:tpulse 1.6s ease-in-out infinite; }
  /* M12 mobile: shrink the title card so a 390px phone sees the whole CTA */
  @media (max-width:520px), (max-height:520px) {
    .tlogo { font-size:34px; letter-spacing:5px; }
    .ttag { font-size:13px; letter-spacing:1.5px; }
    .tctrl { font-size:12px; padding:0 18px; }
    .tgo { font-size:16px; padding:10px 20px; }
    .title { gap:8px; }
  }
  /* M12: mute toggle — top-right on desktop, drops below the button stack on touch */
  .mutebtn { position:absolute; top:calc(14px + env(safe-area-inset-top));
    right:calc(18px + env(safe-area-inset-right)); z-index:5; pointer-events:auto;
    width:44px; height:44px; border-radius:12px; touch-action:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:20px;
    background:#0e0f1499; border:2px solid #ffffff2e; user-select:none; -webkit-user-select:none; }
  .mutebtn.muted { color:#e64433; border-color:#e6443366; }
  /* on touch layouts the buttons own the right edge — mute stacks below BAG,
     the bladder bar lifts ABOVE the thumbstick so the thumb never covers it */
  @media (pointer:coarse) {
    .mutebtn { top:calc(310px + env(safe-area-inset-top)); width:64px; height:52px; }
    .bar { left:14px; width:min(58vw,300px); bottom:calc(168px + env(safe-area-inset-bottom)); }
    .state { left:14px; bottom:calc(200px + env(safe-area-inset-bottom)); }
    .toast { top:118px; left:12px; transform:none; text-align:left; font-size:15px;
      max-width:calc(100vw - 150px); }
    .hint { bottom:30vh; font-size:16px; }
  }
  @keyframes tpulse { 0%,100% { opacity:1; box-shadow:0 0 0 #e67a1400; } 50% { opacity:.72; box-shadow:0 0 22px #e67a1455; } }
  /* M11: touch controls — virtual stick (left), look zone (right field),
     action buttons (top-right). All pointer-events:auto islands in the HUD. */
  .tjoybase { position:absolute; left:26px; bottom:calc(26px + env(safe-area-inset-bottom));
    width:124px; height:124px; border-radius:50%; pointer-events:auto;
    background:#0e0f1466; border:2px solid #ffffff2e; touch-action:none; }
  .tjoyknob { position:absolute; left:50%; top:50%; width:54px; height:54px; margin:-27px 0 0 -27px;
    border-radius:50%; background:#e67a1499; border:2px solid #ff9c3daa;
    transform:translate(var(--kx,0px), var(--ky,0px)); }
  .tbtn { position:absolute; right:calc(18px + env(safe-area-inset-right)); pointer-events:auto;
    min-width:64px; height:64px; padding:0 14px; border-radius:14px; touch-action:none;
    display:flex; align-items:center; justify-content:center;
    font:800 13px/1.2 "Segoe UI", system-ui, sans-serif; letter-spacing:1.5px;
    color:#e8ecf2; background:#0e0f1499; border:2px solid #ffffff2e;
    text-shadow:0 1px 3px #000; user-select:none; -webkit-user-select:none; }
  .tbtn.active { background:#e67a14aa; border-color:#ff9c3d; }
  .tbtnSprint { top:calc(14px + env(safe-area-inset-top)); }
  .tbtnCrouch { top:88px; }
  .tbtnUse { top:162px; }
</style>
</head>
<body>
<div id="hud"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
